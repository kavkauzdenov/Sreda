name: Verify
on:
  push:
    branches: ["main"]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sreda
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: sreda_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sreda -d sreda_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://sreda:ci-only-password@localhost:5432/sreda_test
      NEXT_PUBLIC_DATA_SOURCE: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Shell syntax checks
        run: bash -n deploy/release.sh deploy/backup.sh deploy/restore-drill.sh
      - run: npm test
      # Опт-ин-сьют на НАСТОЯЩЕЙ PostgreSQL из service postgres:17.
      # TEST_DATABASE_URL задан на уровне job; при его отсутствии сьют
      # падает с явной ошибкой настройки, а не «зеленеет» пропуском.
      - run: npm run test:pg
      - run: npm run lint -- --max-warnings=0
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:http
      - name: Build deployment image and check worker imports
        run: |
          docker build -t sreda-ci .
          docker run --rm --entrypoint node sreda-ci --import tsx --input-type=module -e 'await Promise.all([import("./src/server/telegram/service.ts"), import("./src/server/vk/service.ts"), import("./src/server/booking/service.ts"), import("./src/server/posts/service.ts"), import("./src/server/solutions/service.ts")]);'

  ui-gate:
    name: UI gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sreda
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: sreda_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sreda -d sreda_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://sreda:ci-only-password@localhost:5432/sreda_test
      NEXT_PUBLIC_DATA_SOURCE: api
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build PR app
        run: npm run build
      - name: Start isolated UI app (PR code + disposable Postgres)
        id: app
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node --import tsx scripts/ci-ui-app.mjs start > artifacts/ci-ui-app.log 2>&1 &
          echo $! > artifacts/ci-ui-app.pid
          for i in $(seq 1 90); do
            if [ -f artifacts/ci-ui-app.json ]; then
              ORIGIN=$(node -e "console.log(JSON.parse(require('fs').readFileSync('artifacts/ci-ui-app.json','utf8')).origin)")
              if curl -skf "$ORIGIN/login" >/dev/null; then
                echo "origin=$ORIGIN" >> "$GITHUB_OUTPUT"
                echo "UI app ready at $ORIGIN (sha=${GITHUB_SHA})"
                exit 0
              fi
            fi
            sleep 2
          done
          echo "=== ci-ui-app.log ===" >&2
          tail -200 artifacts/ci-ui-app.log >&2 || true
          exit 1
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Playwright ui-system (Chromium)
        env:
          E2E_BASE_URL: ${{ steps.app.outputs.origin }}
          AUDIT_BASE_URL: ${{ steps.app.outputs.origin }}
        run: npx playwright test e2e/ui-system.spec.mjs --project=chromium
      - name: Playwright ui-system (WebKit)
        env:
          E2E_BASE_URL: ${{ steps.app.outputs.origin }}
          AUDIT_BASE_URL: ${{ steps.app.outputs.origin }}
        run: npx playwright test e2e/ui-system.spec.mjs --project=webkit

      # Shared register → recovery-confirm → business create for Clients V2 + responsive audit.
      - name: Prepare auth storage for responsive audit
        id: auth
        env:
          AUDIT_BASE_URL: ${{ steps.app.outputs.origin }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { chromium } from "playwright";
          import { writeFile, mkdir } from "node:fs/promises";
          const base = process.env.AUDIT_BASE_URL;
          await mkdir("artifacts", { recursive: true });
          const browser = await chromium.launch({ headless: true });
          const ctx = await browser.newContext({ ignoreHTTPSErrors: true });
          const page = await ctx.newPage();
          const suffix = `${Date.now().toString(36)}${Math.random().toString(36).slice(2, 5)}`;
          const user = `uigat${suffix}`.slice(0, 28);
          const pass = "AcceptTest!2026ui";
          const res = await page.goto(base + "/register", { waitUntil: "networkidle", timeout: 90000 });
          if (!res || res.status() >= 500) {
            throw new Error(`NETWORK_UNAVAILABLE: register ${res?.status()}`);
          }
          await page.locator("#account-login").waitFor({ state: "visible", timeout: 30000 });
          await page.waitForTimeout(1500);
          await page.locator("#account-login").click();
          await page.locator("#account-login").pressSequentially(user, { delay: 15 });
          await page.locator("#account-password").fill(pass);
          await page.locator("#account-confirmation").fill(pass);
          await page.getByRole("button", { name: /создать аккаунт/i }).click();
          const checkbox = page.locator("label.recovery-confirm input[type=checkbox]");
          await checkbox.waitFor({ state: "attached", timeout: 45000 });
          await page.locator("label.recovery-confirm").click();
          await page.getByRole("button", { name: /продолжить/i }).click();
          await page.waitForFunction(() => !location.pathname.includes("/register"), null, { timeout: 45000 });
          if (page.url().includes("business/new")) {
            const name = page.locator("#business-name");
            await name.waitFor({ state: "visible", timeout: 20000 });
            await page.waitForTimeout(800);
            await name.click();
            await name.fill("");
            await name.pressSequentially(`UI Gate ${suffix}`, { delay: 15 });
            const createPromise = page.waitForResponse(
              (r) => r.url().includes("/api/v1/businesses") && r.request().method() === "POST",
              { timeout: 60000 },
            );
            await page.getByRole("button", { name: /создать пространство/i }).click();
            const createRes = await createPromise.catch(() => null);
            if (createRes && !createRes.ok()) {
              throw new Error(`PRODUCT_REGRESSION: create business HTTP ${createRes.status()}`);
            }
            await page.waitForFunction(
              () => !location.pathname.includes("/business/new"),
              null,
              { timeout: 60000 },
            );
          }
          await writeFile("artifacts/audit-storage.json", JSON.stringify(await ctx.storageState(), null, 2));
          await browser.close();
          console.log("storage written (ephemeral)");
          JS
      - name: Playwright Clients V2 (Chromium)
        env:
          E2E_BASE_URL: ${{ steps.app.outputs.origin }}
          AUDIT_BASE_URL: ${{ steps.app.outputs.origin }}
          AUDIT_STORAGE_STATE: artifacts/audit-storage.json
          AUDIT_OUTPUT: artifacts/clients-v2-ui-audit
          E2E_SCREENSHOT_DIR: artifacts/clients-v2-ui-audit
          AUDIT_IGNORE_HTTPS_ERRORS: "1"
        run: |
          mkdir -p artifacts/clients-v2-ui-audit
          npx playwright test e2e/clients-v2.spec.mjs --project=chromium
      - name: Playwright Clients V2 (WebKit)
        env:
          E2E_BASE_URL: ${{ steps.app.outputs.origin }}
          AUDIT_BASE_URL: ${{ steps.app.outputs.origin }}
          AUDIT_STORAGE_STATE: artifacts/audit-storage.json
          AUDIT_OUTPUT: artifacts/clients-v2-ui-audit
          E2E_SCREENSHOT_DIR: artifacts/clients-v2-ui-audit
          AUDIT_IGNORE_HTTPS_ERRORS: "1"
        run: |
          mkdir -p artifacts/clients-v2-ui-audit
          npx playwright test e2e/clients-v2.spec.mjs --project=webkit
      - name: Playwright Orders V2 (Chromium)
        env:
          E2E_BASE_URL: ${{ steps.app.outputs.origin }}
          AUDIT_BASE_URL: ${{ steps.app.outputs.origin }}
          AUDIT_STORAGE_STATE: artifacts/audit-storage.json
          AUDIT_OUTPUT: artifacts/orders-v2-ui-audit
          E2E_SCREENSHOT_DIR: artifacts/orders-v2-ui-audit
          AUDIT_IGNORE_HTTPS_ERRORS: "1"
        run: |
          mkdir -p artifacts/orders-v2-ui-audit
          npx playwright test e2e/orders-v2.spec.mjs --project=chromium
      - name: Playwright Orders V2 (WebKit)
        env:
          E2E_BASE_URL: ${{ steps.app.outputs.origin }}
          AUDIT_BASE_URL: ${{ steps.app.outputs.origin }}
          AUDIT_STORAGE_STATE: artifacts/audit-storage.json
          AUDIT_OUTPUT: artifacts/orders-v2-ui-audit
          E2E_SCREENSHOT_DIR: artifacts/orders-v2-ui-audit
          AUDIT_IGNORE_HTTPS_ERRORS: "1"
        run: |
          mkdir -p artifacts/orders-v2-ui-audit
          npx playwright test e2e/orders-v2.spec.mjs --project=webkit
      - name: Playwright intelligence research passport (Chromium)
        env:
          E2E_BASE_URL: ${{ steps.app.outputs.origin }}
          AUDIT_BASE_URL: ${{ steps.app.outputs.origin }}
          AUDIT_STORAGE_STATE: artifacts/audit-storage.json
          AUDIT_OUTPUT: artifacts/intelligence-research-ui-audit
          E2E_SCREENSHOT_DIR: artifacts/intelligence-research-ui-audit
          AUDIT_IGNORE_HTTPS_ERRORS: "1"
        run: |
          mkdir -p artifacts/intelligence-research-ui-audit
          npx playwright test e2e/intelligence-research.spec.mjs --project=chromium
      - name: Playwright contrast computed styles
        env:
          E2E_BASE_URL: ${{ steps.app.outputs.origin }}
          AUDIT_BASE_URL: ${{ steps.app.outputs.origin }}
        run: npx playwright test e2e/contrast-computed.spec.mjs --project=chromium
      - name: Leads V2 authenticated UI audit
        env:
          AUDIT_BASE_URL: ${{ steps.app.outputs.origin }}
          AUDIT_OUTPUT: artifacts/leads-v2-ui-audit
          AUDIT_IGNORE_HTTPS_ERRORS: "1"
        run: |
          mkdir -p artifacts/leads-v2-ui-audit
          node scripts/leads-v2-ui-audit.mjs
          test -f artifacts/leads-v2-ui-audit/report.json
          PNG_COUNT=$(find artifacts/leads-v2-ui-audit -name '*.png' | wc -l | tr -d ' ')
          test "$PNG_COUNT" -ge 10
          echo "Leads V2 UI screenshots: $PNG_COUNT"
      - name: Responsive audit (authenticated, PR build)
        env:
          AUDIT_BASE_URL: ${{ steps.app.outputs.origin }}
          AUDIT_STORAGE_STATE: artifacts/audit-storage.json
          AUDIT_OUTPUT: artifacts/responsive-audit
          AUDIT_IGNORE_HTTPS_ERRORS: "1"
        run: |
          mkdir -p artifacts/responsive-audit
          npm run audit:responsive
      - name: Scrub auth storage (never upload)
        if: always()
        run: |
          rm -f artifacts/audit-storage.json
          echo "AUDIT_STORAGE_ARTIFACT_REMOVED=yes"
      - name: Stop isolated UI app
        if: always()
        run: |
          node --import tsx scripts/ci-ui-app.mjs stop || true
          if [ -f artifacts/ci-ui-app.pid ]; then
            kill "$(cat artifacts/ci-ui-app.pid)" 2>/dev/null || true
          fi
      - name: Sanitize CI app state before upload
        if: always()
        run: |
          rm -f artifacts/audit-storage.json
          if [ -f artifacts/ci-ui-app.json ]; then
            node -e "
              const fs = require('fs');
              const s = JSON.parse(fs.readFileSync('artifacts/ci-ui-app.json','utf8'));
              delete s.adminUrl;
              delete s.adminUrlRaw;
              delete s.databaseUrl;
              fs.writeFileSync('artifacts/ci-ui-app.json', JSON.stringify(s, null, 2));
            "
          fi
      - name: Upload UI gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biznesoty-ui-gate-${{ github.sha }}
          path: |
            artifacts/responsive-audit/
            artifacts/leads-v2-ui-audit/
            artifacts/clients-v2-ui-audit/
            artifacts/orders-v2-ui-audit/
            artifacts/ci-ui-app.json
            artifacts/ci-ui-app.log
          retention-days: 14
          if-no-files-found: warn
