name: Visual audit
on:
  workflow_dispatch:
    inputs:
      target:
        description: "pr = local PR build; production = live biznesoty.ru (post-merge read-only audit)"
        required: true
        default: "pr"
        type: choice
        options:
          - pr
          - production
  pull_request:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sreda
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: sreda_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sreda -d sreda_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
        # Postgres only needed for PR-local capture
    env:
      TEST_DATABASE_URL: postgresql://sreda:ci-only-password@localhost:5432/sreda_test
      NEXT_PUBLIC_DATA_SOURCE: api
      NEXT_TELEMETRY_DISABLED: "1"
      VISUAL_TARGET: ${{ github.event.inputs.target || 'pr' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build PR app
        if: env.VISUAL_TARGET == 'pr'
        run: npm run build

      - name: Start isolated UI app (PR code)
        if: env.VISUAL_TARGET == 'pr'
        id: app
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node --import tsx scripts/ci-ui-app.mjs start > artifacts/ci-ui-app.log 2>&1 &
          echo $! > artifacts/ci-ui-app.pid
          for i in $(seq 1 90); do
            if [ -f artifacts/ci-ui-app.json ]; then
              ORIGIN=$(node -e "console.log(JSON.parse(require('fs').readFileSync('artifacts/ci-ui-app.json','utf8')).origin)")
              if curl -skf "$ORIGIN/login" >/dev/null; then
                echo "origin=$ORIGIN" >> "$GITHUB_OUTPUT"
                echo "Visual PR app ready at $ORIGIN (sha=${GITHUB_SHA})"
                exit 0
              fi
            fi
            sleep 2
          done
          tail -200 artifacts/ci-ui-app.log >&2 || true
          exit 1

      - name: Capture screenshots (PR build)
        if: env.VISUAL_TARGET == 'pr'
        id: capture_pr
        env:
          AUDIT_BASE_URL: ${{ steps.app.outputs.origin }}
          AUDIT_OUTPUT: artifacts/visual-audit
          AUDIT_PHASE: pr
          AUDIT_IGNORE_HTTPS_ERRORS: "1"
          AUDIT_REQUIRE_READY: "1"
        run: |
          set -euo pipefail
          node scripts/ui-audit-capture.mjs
          PNG_COUNT=$(find artifacts/visual-audit -name '*.png' | wc -l | tr -d ' ')
          echo "png_count=${PNG_COUNT}" >> "$GITHUB_OUTPUT"
          test -f artifacts/visual-audit/report.json
          test "$PNG_COUNT" -ge 1
          echo "Captured ${PNG_COUNT} PR PNGs against ${GITHUB_SHA}"

      - name: Capture screenshots (production post-merge)
        if: env.VISUAL_TARGET == 'production'
        id: capture_staging
        env:
          AUDIT_BASE_URL: ${{ vars.AUDIT_BASE_URL }}
          AUDIT_OUTPUT: artifacts/visual-audit
          AUDIT_PHASE: staging
          AUDIT_USER: ${{ secrets.AUDIT_USER }}
          AUDIT_PASS: ${{ secrets.AUDIT_PASS }}
          AUDIT_REQUIRE_READY: "1"
          AUDIT_CLEANUP_THROWAWAY: "1"
        run: |
          set -euo pipefail
          export AUDIT_BASE_URL="${AUDIT_BASE_URL:-https://biznesoty.ru}"
          node scripts/ui-audit-capture.mjs
          PNG_COUNT=$(find artifacts/visual-audit -name '*.png' | wc -l | tr -d ' ')
          echo "png_count=${PNG_COUNT}" >> "$GITHUB_OUTPUT"
          test -f artifacts/visual-audit/report.json
          test "$PNG_COUNT" -ge 1

      - name: Scrub auth storage if any
        if: always()
        run: |
          rm -f artifacts/audit-storage.json artifacts/visual-audit/storage*.json || true
          echo "AUDIT_STORAGE_ARTIFACT_REMOVED=yes"

      - name: Stop isolated UI app
        if: always() && env.VISUAL_TARGET == 'pr'
        run: |
          node --import tsx scripts/ci-ui-app.mjs stop || true
          if [ -f artifacts/ci-ui-app.pid ]; then
            kill "$(cat artifacts/ci-ui-app.pid)" 2>/dev/null || true
          fi

      - name: Sanitize CI app state before upload
        if: always()
        run: |
          rm -f artifacts/audit-storage.json
          if [ -f artifacts/ci-ui-app.json ]; then
            node -e "
              const fs = require('fs');
              const s = JSON.parse(fs.readFileSync('artifacts/ci-ui-app.json','utf8'));
              delete s.adminUrl;
              delete s.adminUrlRaw;
              delete s.databaseUrl;
              fs.writeFileSync('artifacts/ci-ui-app.json', JSON.stringify(s, null, 2));
            "
          fi

      - name: Upload visual artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: biznesoty-visual-audit-${{ github.sha }}
          path: |
            artifacts/visual-audit/
            artifacts/ci-ui-app.json
            artifacts/ci-ui-app.log
          retention-days: 21
          if-no-files-found: error
